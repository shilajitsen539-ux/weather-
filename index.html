<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StormSight</title>

    <link rel="stylesheet" href="style.css">
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>

<body>

    <div id="skyBackground">

    <div id="sun"></div>

<div id="moonContainer">

    <div id="moon"></div>

    <div id="moonInfo">

    </div>

</div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="cloud cloud5"></div>
    <div class="cloud cloud6"></div>

    <div id="stars"></div>
    <div id="rain"></div>

</div>

    <div class="weather-container">

        <h1>StormSight</h1>

        <p>Check the current weather of any city</p>

        <div class="search-box">
            <button id="themeBtn">🌙 Dark Mode</button>
            <div class="unit-box">

    <button id="celsiusBtn">°C</button>

    <button id="fahrenheitBtn">°F</button>

</div>
         
            <div class="main-search">
                
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button id="searchBtn">Search</button>
</div>

<div id="locationSuggestions"></div>

        </div>
<div class="location-section">

  <!-- My Location Button -->
  <div class="map-controls">
    <button id="myLocationBtn" type="button">
      📍 My Location
    </button>
  </div>

  <div id="mapLocationSuggestions"></div>
  <div id="map"></div>

</div>

<div id="weatherResult"></div>

<div id="forecastResult"></div>

<div id="historyResult"></div>
<!-- ================= COPYRIGHT FOOTER ================= -->



<!-- Major Natural Disasters -->

<section id="disasterSection">

    <h2>🌍 Major Natural Disasters</h2>

    <p class="disaster-subtitle">
        Major natural disasters around the world from 2016 to 2025
    </p>

    <div id="disasterContainer">

        <!-- Disaster cards will be added here using JavaScript -->

    </div>

</section>
<footer class="site-footer">

    <div class="footer-content">

        <h3>StormSight</h3>

        <p>
            Developed with ❤️ by <strong>7 ERROR</strong>
        </p>

        <p class="copyright-text">
            &copy; 2026 7 ERROR. All Rights Reserved.
        </p>

    </div>

</footer>

</div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
<!-- Major Natural Disasters -->

</body>

</html>
